<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>โปรไฟล์ | TUM9</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="account.css">
  <link rel="stylesheet" href="home-chat.css">
</head>
<body>
  <header class="site-header">
    <div class="container-nav">
      <a class="logo" href="index.html"><span>TUM9</span></a>
      <nav aria-label="Main navigation">
        <ul class="nbr">
          <li><a href="index.html">Home</a></li>
          <li><a href="fortune.html">Fortune</a></li>
          <li><a href="about.html">About</a></li>
          <li><a href="contact.html">Contact</a></li>
        </ul>
        <ul class="nbr account-links">
          <li><a href="login.html">Login</a></li>
          <li><a href="register.html">Register</a></li>
          <li><a href="profile.html" aria-current="page">Profile</a></li>
        </ul>
      </nav>
    </div>
  </header>
  <main class="account-main">
    <section class="account-card profile-card" aria-labelledby="page-title">
      <div class="profile-avatar" aria-hidden="true">✦</div>
      <p class="account-eyebrow">YOUR SPACE</p>
      <h1 id="page-title">โปรไฟล์ของฉัน</h1>
      <p class="account-intro">พื้นที่สำหรับข้อมูลและประวัติการดูดวงของคุณ</p>
      <div data-profile-signed-out hidden>
        <p class="account-notice">กรุณาเข้าสู่ระบบเพื่อดูประวัติคำทำนายของคุณ</p>
        <a class="account-submit profile-login" href="login.html">เข้าสู่ระบบ</a>
      </div>
      <div data-profile-signed-in hidden>
        <dl class="profile-details">
          <div><dt>ชื่อที่ใช้แสดง</dt><dd data-profile-name></dd></div>
          <div><dt>อีเมล</dt><dd data-profile-email></dd></div>
          <div><dt>ประวัติการดูดวง</dt><dd data-history-count>กำลังโหลด...</dd></div>
        </dl>
        <section class="history-list" data-history-list aria-live="polite"></section>
        <button type="button" class="account-submit profile-login" data-sign-out>ออกจากระบบ</button>
      </div>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script src="supabase-client.js"></script>
  <script src="profile.js"></script>
  <script src="auth-nav.js"></script>
</body>
</html>
